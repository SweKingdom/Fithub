name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fithub
          POSTGRES_PASSWORD: fithub
          POSTGRES_DB: fithub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fithub -d fithub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: UTC
      NODE_ENV: test
      DATABASE_URL: postgres://fithub:fithub@localhost:5432/fithub_test
      AUTH_SCRYPT_COST: '16384'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
