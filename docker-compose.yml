services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fithub
      POSTGRES_PASSWORD: fithub
      POSTGRES_DB: fithub
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U fithub
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
